name: Daily job digest
on:
  schedule:
    # 02:30 UTC = 08:00 IST, daily
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch jobs (free tiers)
        env:
          JSEARCH_KEY: ${{ secrets.JSEARCH_KEY }}
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
        run: node scripts/fetch-jobs.mjs
      - name: Commit jobs.json if changed
        run: |
          git config user.name "job-search-bot"
          git config user.email "job-search-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Daily jobs digest"
          git push
